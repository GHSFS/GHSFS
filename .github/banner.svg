<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#ff7043"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ff7043" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>

  <path d="M0 200 Q 300 160 600 195 T 1200 175 L 1200 260 L 0 260 Z" fill="url(#wave)"/>
  <path d="M0 220 Q 300 195 600 215 T 1200 200 L 1200 260 L 0 260 Z" fill="#ff7043" fill-opacity="0.22"/>

  <text x="60" y="120"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="84"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="2">
    GHSFS
  </text>

  <text x="62" y="160"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="20"
        font-weight="500"
        fill="#ff7043"
        letter-spacing="1">
    &gt; cargo run --release --bin desktop-tooling
  </text>

  <text x="62" y="200"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#c9d1d9"
        opacity="0.85">
    building small, sharp tools in Rust  ·  Windows desktop  ·  GitHub Actions
  </text>

  <g transform="translate(960, 70)" opacity="0.18">
    <path d="M50 0 L100 28.87 L100 86.6 L50 115.47 L0 86.6 L0 28.87 Z"
          fill="none" stroke="#ff7043" stroke-width="2"/>
    <path d="M50 22 L78 38 L78 70 L50 86 L22 70 L22 38 Z"
          fill="none" stroke="#ff7043" stroke-width="2"/>
    <circle cx="50" cy="54" r="6" fill="#ff7043"/>
  </g>

  <rect x="0" y="256" width="1200" height="4" fill="#ff7043"/>
</svg>
